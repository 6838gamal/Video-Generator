<!DOCTYPE html>
<html>
<head>
    <title>AI Video Generator</title>

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            margin: auto;
            backdrop-filter: blur(10px);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
        }

        button {
            background: #00c6ff;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        video {
            margin-top: 20px;
            border-radius: 15px;
            width: 100%;
        }
    </style>

</head>
<body>

<div class="box">

<h2>🎬 AI Video Generator</h2>

<form action="/generate" method="post">

<textarea name="prompt" placeholder="أدخل وصف المشهد" required></textarea>

<input type="number" name="duration" placeholder="مدة الفيديو بالثواني" required>

<button type="submit">Generate Video</button>

</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if video_file %}
<h3>✅ الفيديو الناتج</h3>

<video controls>
    <source src="/video/{{ video_file }}">
</video>

<br><br>

<a href="/download/{{ video_file }}">
<button>تحميل الفيديو</button>
</a>

{% endif %}

</div>

</body>
</html>
